      '<div class="row" id="prev">' + (a.img ? '<img class="thumb" src="' + esc(a.img) + '" alt=""><button class="btn" data-act="quitar-foto">Quitar foto</button>' : "") + '</div>' + '<label>Logo del nombre (opcional)<input type="file" id="f-logo" accept="image/*"><span class="hint">Se muestra debajo de la tarjeta en lugar del nombre. Si tiene fondo de un solo color (blanco o negro, por ejemplo), se quita solo.</span></label><div class="row" id="prevL">' + (a.logo ? '<img class="thumb" style="width:160px;height:auto;max-height:70px;object-fit:contain;background:rgba(255,255,255,.08)" src="' + esc(a.logo) + '" alt=""><button class="btn" data-act="quitar-logo">Quitar logo</button>' : "") + '</div>' + botones + '</div>';
    document.getElementById("f-foto").addEventListener("change", async ev => {
      const f = ev.target.files[0]; if (!f) return;
      try { foto = await fotoData(f); document.getElementById("prev").innerHTML = '<img class="thumb" src="' + foto + '" alt="">'; } catch (e) { msg("No se pudo leer esa imagen."); }
    });
  } else {
    const c = form.i >= 0 ? ARTISTAS[form.a].canciones[form.i] : { titulo: "", original: "", letra: "", creditos: "Adaptación: Bochii" };
    foto = c.img; audioId = c.audio; guiaId = c.guia; logoD = c.logo;
    $title.textContent = form.i >= 0 ? "Editar letra" : "Nueva canción";
    $app.innerHTML = '<div class="form"><label>Título en español<input class="field" id="f-titulo" value="' + esc(c.titulo) + '"></label>' +
      '<label>Título original<input class="field" id="f-original" value="' + esc(c.original) + '"></label>' +
      '<label>Imagen de la canción (opcional)<input type="file" id="f-foto" accept="image/*"></label><div class="row" id="prev">' + (c.img ? '<img class="thumb" src="' + esc(c.img) + '" alt=""><button class="btn" data-act="quitar-foto">Quitar foto</button>' : "") + '</div>' +
      '<label>Logo del título (opcional)<input type="file" id="f-logo" accept="image/*"><span class="hint">Se muestra debajo de la tarjeta en lugar del título. Si tiene fondo de un solo color (blanco o negro, por ejemplo), se quita solo.</span></label><div class="row" id="prevL">' + (c.logo ? '<img class="thumb" style="width:160px;height:auto;max-height:70px;object-fit:contain;background:rgba(255,255,255,.08)" src="' + esc(c.logo) + '" alt=""><button class="btn" data-act="quitar-logo">Quitar logo</button>' : "") + '</div>' +
      '<label>Color de la tarjeta<input type="color" id="f-color" value="' + esc(c.color || ARTISTAS[form.a].color) + '"><span class="hint">Se toma de la imagen al subirla; puedes cambiarlo.</span></label>' +
      '<label>Audio de la canción original (opcional)<input type="file" id="f-audio" accept="audio/*,video/mp4,video/webm"><span class="hint" id="audhint">' + (c.audio ? "Ya tiene audio cargado." : "mp3 o m4a, hasta 20 MB.") + '</span></label><div class="row" id="audrow">' + (c.audio ? '<button class="btn" data-act="quitar-audio">Quitar audio</button>' : "") + '</div>' +
      '<label>Guía vocal (opcional)<input type="file" id="f-guia" accept="audio/*,video/mp4,video/webm"><span class="hint" id="guiahint">' + (c.guia ? "Ya tiene guía cargada." : "Tu voz cantando la letra en español. mp3 o m4a, hasta 20 MB.") + '</span></label><div class="row" id="guiarow">' + (c.guia ? '<button class="btn" data-act="quitar-guia">Quitar guía</button>' : "") + '</div>' +
      '<label>Créditos de la guía<textarea class="field" id="f-guiacred" style="min-height:90px">' + esc(c.guiaCred) + '</textarea><span class="hint">Por ejemplo: Voz: Bochii. Mezcla: …</span></label>' +

function ligarFoto(){
  document.getElementById("f-foto").addEventListener("change", async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try { foto = await fotoData(f); document.getElementById("prev").innerHTML = '<img class="thumb" src="' + foto + '" alt="">'; } catch (e) { msg("No se pudo leer esa imagen."); }
  });
}

function fotoData(f, max){
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => { const i = new Image(); i.onload = () => { const k = Math.min(1, (max || 480) / Math.max(i.width, i.height)), c = document.createElement("canvas"); c.width = Math.round(i.width * k); c.height = Math.round(i.height * k); c.getContext("2d").drawImage(i, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", .8)); }; i.onerror = no; i.src = r.result; };
    r.onerror = no; r.readAsDataURL(f);
  });
}

async function guardar(){
  if (!token()) { msg("Activa el modo editor para guardar."); return; }
  msg("Guardando…");
  try {
    await ghPut("datos.json", textoB64(JSON.stringify({ perfil: DATOS.perfil, artistas: ARTISTAS })), "Actualizar datos");
    msg("Guardado ✓ Se verá en la página pública en ~1 minuto");
    setTimeout(() => msg(""), 6000);
  } catch (e) { msg("No se pudo guardar: " + (e.message || e)); }
}

let pendiente = "";
async function accion(k){
  const { ai, ci } = ruta();
  if (k.startsWith("del-") && pendiente !== k) { pendiente = k; msg("Toca otra vez para confirmar que quieres eliminar."); return; }
  pendiente = ""; msg("");
  if (k === "edit-perfil") form = { t: "p" };
  else if (k === "nuevo-art") form = { t: "a", i: -1 };
  else if (k === "edit-art") form = { t: "a", i: ai };
  else if (k === "nueva-can") form = { t: "c", a: ai, i: -1 };
  else if (k === "edit-can") form = { t: "c", a: ai, i: ci };
  else if (k === "cancelar") form = null;
  else if (k === "quitar-logo") { logoD = undefined; document.getElementById("prevL").innerHTML = ""; return; }
  else if (k === "quitar-guia") { guiaId = undefined; document.getElementById("guiahint").textContent = "Guía quitada."; document.getElementById("guiarow").innerHTML = ""; return; }
  else if (k === "quitar-audio") { audioId = undefined; document.getElementById("audhint").textContent = "Audio quitado."; document.getElementById("audrow").innerHTML = ""; return; }
  else if (k === "quitar-portada") { fotoP = undefined; document.getElementById("prevP").innerHTML = ""; return; }
  else if (k === "quitar-foto") { foto = undefined; document.getElementById("prev").innerHTML = ""; return; }
  else if (k === "del-art") { ARTISTAS.splice(ai, 1); location.hash = ""; return guardar(); }
  else if (k === "del-can") { ARTISTAS[ai].canciones.splice(ci, 1); ARTISTAS[ai].act = Date.now(); location.hash = slug(ARTISTAS[ai].nombre); return guardar(); }
  else if (k === "guardar-form" && form.t === "p") {
    DATOS.perfil = { bio: document.getElementById("f-bio").value.trim(), img: foto || "", portada: fotoP || "" };
    form = null; return guardar();
  }
  else if (k === "guardar-form") {
    if (form.t === "a") {
      const nombre = document.getElementById("f-nombre").value.trim();
      if (!nombre) return msg("Escribe un nombre.");
      const d = { nombre, genero: document.getElementById("f-genero").value.trim() || "Otros", color: document.getElementById("f-color").value, canciones: form.i >= 0 ? ARTISTAS[form.i].canciones : [], act: Date.now() };
      if (logoD) d.logo = logoD;
      if (foto) d.img = foto;
      if (form.i >= 0) ARTISTAS[form.i] = d; else ARTISTAS.push(d);
      location.hash = slug(nombre);
    } else {
      const titulo = document.getElementById("f-titulo").value.trim(), letra = document.getElementById("f-letra").value;
      if (!titulo || !letra.trim()) return msg("Escribe el título y la letra.");
      const d = { titulo, original: document.getElementById("f-original").value.trim(), creditos: document.getElementById("f-cred").value.trim(), letra };
      const col = document.getElementById("f-color").value; if (col.toLowerCase() !== ARTISTAS[form.a].color.toLowerCase()) d.color = col;
      if (audioId) d.audio = audioId;
      if (logoD) d.logo = logoD;
      if (guiaId) { d.guia = guiaId; const gc = document.getElementById("f-guiacred").value.trim(); if (gc) d.guiaCred = gc; }
      if (foto) d.img = foto;
      const lista = ARTISTAS[form.a].canciones;
      if (form.i >= 0) lista[form.i] = d; else lista.push(d);
      ARTISTAS[form.a].act = Date.now();
      location.hash = slug(ARTISTAS[form.a].nombre) + "--" + slug(titulo);
    }
    form = null; return guardar();
  }
  render();
}

function render(){
  window.scrollTo(0, volver ? (scrolls[location.hash] || 0) : 0);
  if (form) return vistaForm();
  const { ai, ci } = ruta();
  if (ai < 0) return vistaArtistas("");
  const a = ARTISTAS[ai];
  if (!location.hash.includes("--") || ci < 0) return vistaCanciones(a, "");
  vistaLetra(a, a.canciones[ci]);
}

function pintarAcceso(){ document.getElementById("acceso").textContent = editor ? "Cerrar modo editor" : "Acceso de edición"; }
document.getElementById("acceso").addEventListener("click", async () => {
  if (editor) {
    try { localStorage.removeItem(TKN); } catch (e) {}
    editor = false; form = null; pintarAcceso(); render(); msg("Modo editor cerrado"); setTimeout(() => msg(""), 2500);
    return;
  }
  const k = (prompt("Pega aquí tu llave de GitHub (empieza con github_pat_ o ghp_)") || "").trim();
  if (!k) return;
  msg("Comprobando llave…");
  try {
    const r = await fetch("https://api.github.com/repos/" + GH.owner + "/" + GH.repo, { headers: { "Authorization": "Bearer " + k, "Accept": "application/vnd.github+json" } });
    if (!r.ok) throw new Error(errGh(r.status));
    const j = await r.json();
    if (!j.permissions || !j.permissions.push) throw new Error("La llave no tiene permiso de escritura (Contents: Read and write)");
    try { localStorage.setItem(TKN, k); } catch (e) { throw new Error("Este navegador no permite guardar la llave"); }
    editor = true; pintarAcceso(); render(); msg("Modo editor activado ✓"); setTimeout(() => msg(""), 3000);
  } catch (e) { msg("No se pudo activar: " + (e.message || e)); }
});
pintarAcceso();

fetch("datos.json?v=" + Date.now()).then(r => { if (!r.ok) throw new Error("sin datos"); return r.json(); }).then(d => {
  DATOS.perfil = d.perfil || { bio: "", img: "" };
